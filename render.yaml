# Render Blueprint: the API (NestJS) and its PostgreSQL database.
# The frontend is on Vercel (client/vercel.json), which proxies /api and /uploads to this service.
services:
  - type: web
    name: gk-ventures-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    # Migrations and the (idempotent) admin seed run on every start.
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gk-ventures-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 32 random bytes, base64. NEVER change once files are stored.
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # S3-compatible bucket for uploads (Cloudflare R2: S3_REGION=auto, S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com)
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Gilbert K. Kadawa
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: gk-ventures-db
    plan: free
    databaseName: gk_ventures
