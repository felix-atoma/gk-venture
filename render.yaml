# Render Blueprint: the API (NestJS). The PostgreSQL database is external (Neon), set via DATABASE_URL.
# The frontend is on Vercel (client/vercel.json), which proxies /api and /uploads to this service.
services:
  - type: web
    name: gk-ventures-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    # Migrations and the (idempotent) admin seed run on every start.
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/main
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string (Neon: use the direct, non-pooled URL with ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # 32 random bytes, base64. NEVER change once files are stored.
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Uploads are stored (encrypted) in Postgres. To move them to R2/S3 later, add S3_BUCKET,
      # S3_ENDPOINT, S3_REGION, S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY - S3_BUCKET takes precedence.
      - key: STORAGE_DRIVER
        value: database
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Gilbert K. Kadawa
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
